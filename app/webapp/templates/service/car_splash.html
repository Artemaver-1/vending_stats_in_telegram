{# Loading screen of the service app: the worker's car starts up and drives off, then the
   screen dissolves into the task list. #}
<div id="car-splash" class="car-splash" hidden>
  <video src="/static/splash.mp4?v={{ version }}" poster="/static/splash-poster.jpg" playsinline preload="auto"></video>
  <div class="splash-label">Загрузка</div>
  <button class="splash-tap" type="button" hidden>🔑 Нажми, чтобы завести</button>
</div>
